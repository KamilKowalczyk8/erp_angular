<mat-toolbar color="primary">
  <span>Mój System ERP</span>
  <span class="spacer"></span>
  <button mat-button>Produkty</button>
  <button mat-button>Magazyn</button>
  <button mat-icon-button>
    <mat-icon>account_circle</mat-icon>
  </button>
</mat-toolbar>

<mat-form-field appearance="outline" class="login-field">
  <mat-label>Wpisz hasłooo</mat-label>
  <input matInput [type]="hide ? 'password' : 'text'" placeholder="Twoje tajne hasło">
  
  <button mat-icon-button matSuffix (click)="hide = !hide">
    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
  </button>

  <mat-hint>Nigdy nie udostępniaj hasła!</mat-hint>
</mat-form-field>

<div class="container">
  <router-outlet>
      <span>cos</span>
</router-outlet>
</div>
