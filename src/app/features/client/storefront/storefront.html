<div class="storefront-container">
  <h2 class="page-title">Witaj w sklepie! Poznaj nasze produkty</h2>

  <div class="product-grid">
    <mat-card class="product-card" *ngFor="let product of products">
      
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>Ilość na magazynie: {{ product.stockQuantity}} szt.</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="price">{{ product.price | currency:'PLN ':'symbol':'1.2-2' }}</div>        
        <p class="description">
            Kod produktu (SKU): {{ product.skuCode }}        </p>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-raised-button color="primary" 
                (click)="addToCart(product)"
                [disabled]="product.stockQuantity <= 0">
          <mat-icon>add_shopping_cart</mat-icon>
          {{ product.stockQuantity > 0 ? 'Do koszyka' : 'Brak towaru' }}
        </button>
      </mat-card-actions>
      
    </mat-card>
  </div>
</div>
