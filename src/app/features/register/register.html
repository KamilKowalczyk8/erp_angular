<div class="register-wrapper">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Rejestracja</mat-card-title>
    </mat-card-header>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Wpisz swój login">
        <mat-icon matPrefix>person</mat-icon>
        <mat-error *ngIf="registerForm.get('email')?.invalid">Wpisz poprawny email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Hasło</mat-label>
        <input matInput formControlName="password" [type]="hide ? 'password' : 'text'">
        
        <button mat-icon-button matSuffix (click)="hide = !hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Imie</mat-label>
        <input matInput formControlName="firstName" placeholder="Wpisz swoje imię">
        <mat-icon matPrefix>face</mat-icon>
        <mat-error *ngIf="registerForm.get('firstName')?.invalid">Wpisz poprawne imię</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nazwisko</mat-label>
        <input matInput formControlName="lastName" placeholder="Wpisz swoje nazwisko">
        <mat-icon matPrefix>supervisor_account</mat-icon>
        <mat-error *ngIf="registerForm.get('lastName')?.invalid">Wpisz poprawne nazwisko</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Numer telefonu</mat-label>
        <input matInput formControlName="phoneNumber" placeholder="Wpisz swój numer telefonu">
        <mat-icon matPrefix>phone</mat-icon>
        <mat-error *ngIf="registerForm.get('phoneNumber')?.invalid">Wpisz poprawny numer telefonu</mat-error>
      </mat-form-field>

      <mat-checkbox>Zapamiętaj dane</mat-checkbox>
    </mat-card-content>

  <mat-card-actions>
        <button mat-raised-button color="primary" class="full-width" type="submit">ZAREJESTRUJ</button>
      </mat-card-actions>
    </form>

    <div class="login-footer">
      <span>Masz już konto?</span>
      <a mat-button color="primary" routerLink="/dashboard">Zaloguj się</a>
    </div>


  </mat-card>
</div>
