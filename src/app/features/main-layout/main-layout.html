<mat-sidenav-container class="erp-container">
  
  <mat-sidenav mode="side" opened class="erp-sidenav">
    <div class="logo-box">
      <mat-icon>business</mat-icon>
      <span>ERP System</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Pulpit</span>
      </a>

      <a mat-list-item routerLink="/magazyn" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Magazyn</span>
      </a>

      <a mat-list-item routerLink="/klienci" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Klienci</span>
      </a>

      <a mat-list-item routerLink="/sprzedaz" routerLinkActive="active-link">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Sprzedaż</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    
    <mat-toolbar color="primary" class="erp-toolbar">
      <span class="page-title">Moduł Magazynowy</span>
      
      <span class="spacer"></span>

      <span class="user-info">kamil@firma.pl</span>

      <button mat-icon-button (click)="logout()" matTooltip="Wyloguj się">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="workspace p-4">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
