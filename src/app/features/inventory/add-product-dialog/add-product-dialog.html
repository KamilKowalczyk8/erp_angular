<h2 mat-dialog-title>Dodaj Nowy Produkt</h2>

<mat-dialog-content>
    <form [formGroup]="productForm" class="product-form">

    <mat-form-field appearance="outline">
      <mat-label>Nazwa Produktu</mat-label>
      <input matInput formControlName="name">
      <mat-error>Nazwa jest wymagana (min. 3 znaki)</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Kod SKU</mat-label>
      <input matInput formControlName="skuCode">
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Cena (PLN)</mat-label>
        <input matInput type="number" formControlName="price">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Ilość początkowa</mat-label>
        <input matInput type="number" formControlName="stockQuantity">
      </mat-form-field>
    </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onSave()" [disabled]="productForm.invalid">
        Zapisz Produkt
    </button>
    <button mat-button (click)="onCancel()">
        Anuluj
    </button>
</mat-dialog-actions>
